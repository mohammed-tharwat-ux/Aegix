services:
  - type: web
    name: aegix
    env: bun
    plan: starter
    buildCommand: bun install && bun run build
    startCommand: bun start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
